[package]
name = "apexpico"
version = "0.2.0"
edition = "2021"
description = "PicoClaw × APEX — edge self-evolving agent"
license = "MIT"
repository = "https://github.com/hernandez42/APEX"
keywords = ["agent", "apex", "picoclaw", "edge"]
categories = ["command-line-utilities"]
rust-version = "1.70"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
